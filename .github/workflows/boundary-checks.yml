name: Focused boundary checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Boundary and mock regressions
        run: |
          python -m unittest discover -s tests -p 'test_security_boundary_regression.py' -v
          python -m unittest discover -s tests -p 'test_mock_actor_isolation.py' -v
          python -m unittest discover -s tests -p 'test_fault_service.py' -v
          python -m unittest discover -s tests -p 'test_adversarial_recovery.py' -v
          python -m unittest discover -s tests -p 'test_architecture_boundaries.py' -v
