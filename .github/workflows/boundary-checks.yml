name: Focused boundary checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install attach test dependencies
        run: python -m pip install fastapi httpx pyflakes
      - name: Boundary and mock regressions
        run: |
          python -m unittest discover -s tests -p 'test_security_boundary_regression.py' -v
          python -m unittest discover -s tests -p 'test_mock_actor_isolation.py' -v
          python -m unittest discover -s tests -p 'test_fault_service.py' -v
          python -m unittest discover -s tests -p 'test_adversarial_recovery.py' -v
          python -m unittest discover -s tests -p 'test_architecture_boundaries.py' -v
          python -m unittest discover -s tests -p 'test_journal.py' -v
          python -m unittest discover -s tests -p 'test_journaled_edit.py' -v
          python -m unittest discover -s tests -p 'test_code_attach*.py' -v
          python -m unittest discover -s tests -p 'test_kpi.py' -v
  adversarial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install ".[local,test]"
      - name: Offline adversarial acceptance
        run: python -m examples.adversarial_check --output adversarial-report.json
      - name: Preserve measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-${{ matrix.os }}
          path: adversarial-report.json
