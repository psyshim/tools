name: Python regression suite
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python modules
        run: python -m compileall -q coding_agent host_mock tests
      - name: Run entire test suite, including newly added tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
